version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=video_annotator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=local-docker-dev-key
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/video_annotator
      - GEMINI_API_KEY=your-gemini-api-key-here
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      - db

volumes:
  postgres_data: