services:
  # ============================================================
  # BACKEND — Django Web Service
  # ============================================================
  - type: web
    name: video-annotator-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn video_annotation.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true  # Render will generate a secure key
      - key: DATABASE_URL
        fromDatabase:
          name: video-annotator-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false  # You will paste this in the Render dashboard
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # ============================================================
  # FRONTEND — React Static Site
  # ============================================================
  - type: static
    name: video-annotator-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://video-annotator-backend.onrender.com" # Placeholder

databases:
  - name: video-annotator-db
    plan: free
    databaseName: video_annotator
    user: video_user